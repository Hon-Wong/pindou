<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拼豆图纸生成器 · 端到端测试</title>
<style>
  body{font:13px/1.6 -apple-system,"PingFang SC",sans-serif;background:#0f1216;color:#e6edf3;margin:0;padding:16px}
  h1{font-size:16px;margin:0 0 4px}
  #sum{font-size:14px;font-weight:700;padding:8px 12px;border-radius:6px;margin:10px 0;display:inline-block}
  .pass{background:#123d1c;color:#4ade80}
  .fail{background:#4a1216;color:#f87171}
  table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
  td,th{border-bottom:1px solid #2a323d;padding:4px 8px;text-align:left;vertical-align:top}
  th{color:#9aa7b4;font-weight:600}
  tr.f td{background:#2a1417;color:#f87171}
  tr.p td:first-child{color:#4ade80}
  .note{color:#6b7889;font-size:11px}
  /* iframe 必须真实可见：离屏 iframe 的 requestAnimationFrame 会被浏览器节流，
     那样 scheduleCompute() 这条异步路径根本不会执行，测试会假通过。 */
  #frame{width:1400px;height:860px;border:1px solid #2a323d;border-radius:8px;display:block;margin-top:14px}
  h2.sec{font-size:13px;color:#9aa7b4;margin:20px 0 0}
  #gallery{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
  #gallery figure{margin:0;background:#161b22;padding:8px;border-radius:8px;border:1px solid #2a323d}
  #gallery figcaption{font-size:11px;color:#9aa7b4;margin-bottom:6px}
  #gallery canvas,#gallery img{max-width:300px;height:auto;display:block;background:#fff;border-radius:4px}
</style>
</head>
<body>
<h1>拼豆图纸生成器 · 端到端测试</h1>
<p class="note">在真实浏览器里驱动 index.html（同源 iframe），覆盖全部图片样例、算法、抖动、色卡与导出。</p>
<div id="sum">运行中…</div>
<table id="out"><thead><tr><th style="width:40px">结果</th><th style="width:280px">用例</th><th>说明</th></tr></thead><tbody></tbody></table>
<div id="gallery"></div>
<h2 class="sec">被测应用（实时）</h2>
<iframe id="frame" src="../index.html"></iframe>

<script>
(function () {
  'use strict';
  var tbody = document.querySelector('#out tbody');
  var pass = 0, fail = 0;

  function ok(name, cond, note) {
    var tr = document.createElement('tr');
    tr.className = cond ? 'p' : 'f';
    tr.innerHTML = '<td>' + (cond ? '✓' : '✗') + '</td><td>' + name + '</td><td>' + (note || '') + '</td>';
    tbody.appendChild(tr);
    cond ? pass++ : fail++;
    return cond;
  }
  function show(caption, cv) {
    var fig = document.createElement('figure');
    var cap = document.createElement('figcaption');
    cap.textContent = caption;
    fig.appendChild(cap); fig.appendChild(cv);
    document.getElementById('gallery').appendChild(fig);
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /**
   * 轮询等待条件成立。
   * 按「轮数」而不是 Date.now() 计时：headless 的 --virtual-time-budget 会让
   * Date.now() 飞速前进，用挂钟计时的话预算瞬间就烧完了，而 iframe 里
   * requestAnimationFrame 驱动的重算还没来得及跑，会假失败。
   */
  async function waitFor(fn, rounds) {
    rounds = rounds || 150;
    for (var i = 0; i < rounds; i++) {
      try { if (fn()) return true; } catch (e) {}
      await sleep(30);
    }
    return false;
  }

  var frame = document.getElementById('frame');
  var W, APP;

  function loadImg(path, name) {
    // iframe 的 base 是 /index.html，相对路径要在本页先解析成绝对地址
    var abs = new URL(path, location.href).href;
    return new Promise(function (resolve, reject) {
      var img = new W.Image();
      var to = setTimeout(function () { reject(new Error('timeout ' + path)); }, 15000);
      img.onload = function () {
        clearTimeout(to);
        // 直接塞进 app 的 state，绕开 FileReader 的异步链
        APP.state.img = img;
        APP.state.imgName = name || path;
        APP.state.srcW = img.naturalWidth;
        APP.state.srcH = img.naturalHeight;
        resolve(img);
      };
      img.onerror = function () { clearTimeout(to); reject(new Error('load fail ' + abs)); };
      img.src = abs;
    });
  }

  function run(cfg) {
    Object.keys(cfg || {}).forEach(function (k) { APP.opts[k] = cfg[k]; });
    APP.compute();
    return APP.summary();
  }

  frame.addEventListener('load', function () { start().catch(function (e) {
    ok('测试脚本异常', false, e && e.message);
    finish();
  }); });

  async function start() {
    W = frame.contentWindow;
    await sleep(300);
    ok('index.html 载入且模块就绪',
       !!(W.PD && W.PD.app && W.PD.color && W.PD.quantize && W.PD.palettes),
       'PD.app / color / quantize / palettes');
    APP = W.PD.app;
    APP.opts.lockAspect = true;

    var errs = [];
    W.addEventListener('error', function (e) { errs.push(e.message); });

    /* ---------- 1. 风景照：基本正确性 ---------- */
    await loadImg('fixtures/photo_landscape.png', 'photo_landscape.png');
    APP.opts.gridW = 64; APP.opts.gridH = 48; APP.opts.lockAspect = false;
    var s = run({ colors: 16, algo: 'kmeans', dither: 'none', mosaic: 1,
                  sampleMode: 'area', paletteId: 'mard221', alphaTh: 128,
                  brightness: 0, contrast: 0, saturation: 0, gamma: 100, bgRemove: false,
                  blur: 0, sharpen: 0, fitMode: 'cover' });
    ok('风景照 · 网格尺寸 64×48', s.w === 64 && s.h === 48, s.w + '×' + s.h);
    ok('风景照 · 总豆数 = 格数', s.total === 64 * 48, s.total + ' 颗，空格 ' + s.empty);
    ok('风景照 · 色数 ≤ 16 且 ≥ 8', s.colors <= 16 && s.colors >= 8, s.colors + ' 色');
    ok('风景照 · 色号形如「字母+数字」', s.codes.every(function (c) { return /^[A-Za-z]+\d+:/.test(c); }),
       s.codes.slice(0, 6).join(' '));
    ok('风景照 · 天空落在 C 蓝青系 / 草地落在 B 绿系',
       /^C/.test(codeAt(0, 0)) && /^B/.test(codeAt(32, 44)),
       '左上 ' + codeAt(0, 0) + '，下方 ' + codeAt(32, 44));
    ok('风景照 · 各色计数之和 = 总数',
       s.codes.reduce(function (a, c) { return a + (+c.split(':')[1]); }, 0) === s.total);

    /* ---------- 2. 色数控制 ---------- */
    var c4 = run({ colors: 4 }), c32 = run({ colors: 32 });
    ok('量化色数 4 生效', c4.colors <= 4 && c4.colors >= 2, c4.colors + ' 色');
    ok('量化色数 32 生效且多于 4 色', c32.colors > c4.colors && c32.colors <= 32,
       c4.colors + ' → ' + c32.colors);

    /* ---------- 3. 三种算法 ---------- */
    ['kmeans', 'mediancut', 'direct'].forEach(function (a) {
      var r = run({ colors: 16, algo: a });
      ok('算法 ' + a, r && r.colors >= 2 && r.colors <= 16 && r.total === 64 * 48, r.colors + ' 色');
    });

    /* ---------- 4. 三种抖动 ---------- */
    ['none', 'fs', 'ordered'].forEach(function (d2) {
      var r = run({ algo: 'kmeans', colors: 12, dither: d2, ditherAmt: 70 });
      ok('抖动 ' + d2, r && r.total === 64 * 48 && r.colors >= 2, r.colors + ' 色');
    });

    /* ---------- 5. 采样方式 ---------- */
    ['area', 'dpid', 'edge', 'nearest', 'dominant'].forEach(function (m) {
      var r = run({ dither: 'none', colors: 16, sampleMode: m });
      ok('采样 ' + m, r && r.total === 64 * 48, r.colors + ' 色');
    });

    /* ---------- 6. 马赛克 ---------- */
    var m1 = run({ sampleMode: 'area', mosaic: 1 });
    var m6 = run({ mosaic: 6 });
    ok('马赛克 6× 后颜色数不增加', m6.colors <= m1.colors, m1.colors + ' → ' + m6.colors);
    ok('马赛克后格数不变', m6.w === 64 && m6.h === 48 && m6.total === 64 * 48);
    ok('马赛克 6× 确实变粗（同色块变大）', blockUniform(6), '抽查 6×6 区块内同色');
    run({ mosaic: 1 });

    /* ---------- 7. 色卡切换 ---------- */
    [['mard221', /^[ABCDEFGHM]\d+$/], ['hama', /^H\d+$/], ['basic', /^N\d+$/]].forEach(function (p) {
      var r = run({ paletteId: p[0], colors: 16 });
      var allMatch = r.codes.every(function (c) { return p[1].test(c.split(':')[0]); });
      ok('色卡 ' + p[0] + ' 只用本色卡色号', allMatch, r.codes.slice(0, 5).join(' '));
    });
    run({ paletteId: 'mard221' });

    /* ---------- 8. 透明 / 空格 ---------- */
    await loadImg('fixtures/sprite_pixel.png', 'sprite_pixel.png');
    APP.opts.gridW = 32; APP.opts.gridH = 32;
    var sp = run({ colors: 12, sampleMode: 'dominant', algo: 'kmeans', dither: 'none', fitMode: 'contain' });
    ok('像素精灵 · 透明区变成空格', sp.empty > 100 && sp.empty < 32 * 32 * 0.8,
       '空格 ' + sp.empty + ' / ' + (32 * 32));
    ok('像素精灵 · 有豆子的格子 = 总数', sp.total + sp.empty === 32 * 32);
    ok('像素精灵 · 出现 F 红系蘑菇伞',
       sp.codes.some(function (c) { return /^F/.test(c); }), sp.codes.join(' '));

    /* ---------- 9. 扁平插画 ---------- */
    await loadImg('fixtures/flat_logo.png', 'flat_logo.png');
    APP.opts.gridW = APP.opts.gridH = 48;
    var lg = run({ colors: 8, sampleMode: 'dominant' });
    ok('扁平插画 · 少量颜色即可还原', lg.colors >= 3 && lg.colors <= 8, lg.colors + ' 色');
    ok('扁平插画 · 角落为空格', lg.empty > 100, '空格 ' + lg.empty);

    /* ---------- 10. 纯色图 ---------- */
    await loadImg('fixtures/solid.png', 'solid.png');
    APP.opts.gridW = APP.opts.gridH = 32;
    var sd = run({ colors: 16, sampleMode: 'area', fitMode: 'cover' });
    ok('纯色图只产生 1 个颜色', sd.colors === 1, sd.codes.join(' '));

    /* ---------- 11. 全透明图（边界） ---------- */
    await loadImg('fixtures/fully_transparent.png', 'fully_transparent.png');
    var beforeErr = errs.length;
    var tr = run({ colors: 8 });
    ok('全透明图不抛异常', errs.length === beforeErr, tr ? '仍有结果' : '结果为空（已被安全处理）');

    /* ---------- 12. 细长条（极端宽高比） ---------- */
    await loadImg('fixtures/thin_strip.png', 'thin_strip.png');
    APP.opts.lockAspect = true; APP.opts.gridW = 100;
    APP.opts.gridH = Math.max(5, Math.round(100 * 12 / 600));
    var th = run({ colors: 8, fitMode: 'cover' });
    ok('细长条 · 极端宽高比下高度夹到最小值 5', th.h === 5, th.w + '×' + th.h);
    ok('细长条 · 得到 E 粉玫系', th.codes.some(function (c) { return /^E/.test(c); }), th.codes.join(' '));

    /* ---------- 13. 大图性能 ---------- */
    await loadImg('fixtures/big_3000x2000.jpg', 'big_3000x2000.jpg');
    APP.opts.lockAspect = false; APP.opts.gridW = 128; APP.opts.gridH = 85;
    var t0 = performance.now();
    var bg = run({ colors: 32, algo: 'kmeans', dither: 'fs', sampleMode: 'area' });
    var dt = performance.now() - t0;
    ok('3000×2000 → 128×85 / 32 色 用时 < 6s', dt < 6000, Math.round(dt) + ' ms，' + bg.colors + ' 色');
    ok('大图结果完整', bg.total === 128 * 85, bg.total + ' 颗');

    /* ---------- 14. 图像微调 ---------- */
    await loadImg('fixtures/portrait_tones.jpg', 'portrait_tones.jpg');
    APP.opts.gridW = 48; APP.opts.gridH = 48;
    var base = run({ colors: 16, algo: 'kmeans', dither: 'none', sampleMode: 'area',
                     brightness: 0, contrast: 0, saturation: 0, gamma: 100 });
    ok('人像 · 命中 G 棕肤系',
       base.codes.some(function (c) { return /^G/.test(c); }), base.codes.join(' '));
    var dark = run({ brightness: -60 });
    var light = run({ brightness: 60 });
    ok('亮度调节改变配色结果',
       dark.codes.join() !== base.codes.join() && light.codes.join() !== base.codes.join(),
       '暗: ' + dark.codes.slice(0, 3).join(' ') + ' / 亮: ' + light.codes.slice(0, 3).join(' '));
    var gray = run({ brightness: 0, saturation: -100 });
    ok('饱和度 -100 → 主要落在 H 黑白系 / M 大地系等中性色',
       gray.codes.filter(function (c) { return /^[HM]/.test(c); }).length >= gray.codes.length * 0.6,
       gray.codes.join(' '));
    run({ saturation: 0 });

    /* ---------- 15. 背景色移除 ---------- */
    await loadImg('fixtures/portrait_tones.jpg', 'portrait_tones.jpg');
    APP.opts.gridW = APP.opts.gridH = 48;
    var noBg = run({ bgRemove: false, colors: 12 });
    var yesBg = run({ bgRemove: true, bgColor: '#eee8dc', bgTol: 14 });
    ok('移除背景色后空格增多', yesBg.empty > noBg.empty + 100,
       noBg.empty + ' → ' + yesBg.empty + ' 空格');
    run({ bgRemove: false });

    /* ---------- 16. 禁用颜色 ---------- */
    await loadImg('fixtures/photo_landscape.png', 'photo_landscape.png');
    APP.opts.gridW = 64; APP.opts.gridH = 48;
    var r16 = run({ colors: 16, algo: 'kmeans', paletteId: 'mard221' });
    var victim = r16.codes[0].split(':')[0];
    APP.state.disabled.mard221 = {}; APP.state.disabled.mard221[victim] = 1;
    var r17 = run({});
    ok('禁用某色后不再出现该色号',
       !r17.codes.some(function (c) { return c.split(':')[0] === victim; }),
       '禁用 ' + victim + ' → ' + r17.codes.slice(0, 6).join(' '));
    APP.state.disabled.mard221 = {};
    run({});

    /* ---------- 17. 导出 ---------- */
    var chart = APP.renderChartCanvas({ cell: 14, legend: true });
    ok('导出图纸画布尺寸合理',
       chart && chart.width > 64 * 14 && chart.height > 48 * 14 && chart.width < 16384 && chart.height < 16384,
       chart ? chart.width + '×' + chart.height : 'null');
    var pv = APP.renderPreviewCanvas(8);
    ok('导出预览画布尺寸正确', pv && pv.width === 64 * 8 && pv.height === 48 * 8,
       pv ? pv.width + '×' + pv.height : 'null');
    var png = chart.toDataURL('image/png');
    ok('图纸可导出为 PNG（canvas 未被污染）',
       png.indexOf('data:image/png') === 0 && png.length > 5000,
       Math.round(png.length / 1024) + ' KB');

    /* ---------- 18. 视图渲染无异常 ---------- */
    var beforeErr2 = errs.length;
    ['chart', 'preview'].forEach(function (v) {
      APP.view.mode = v;
      [8, 24, 48].forEach(function (c) { APP.view.cell = c; APP.layout(); APP.render(); });
    });
    APP.view.mode = 'chart'; APP.view.cell = 24;
    ['code', 'symbol', 'both', 'none'].forEach(function (l) { APP.view.labelMode = l; APP.render(); });
    APP.view.labelMode = 'code';
    ok('各视图 / 缩放 / 标注模式渲染无报错', errs.length === beforeErr2, errs.slice(beforeErr2).join(' | '));

    /* ---------- 19. CSV / 清单内容 ---------- */
    var csv = APP.buildCSV();
    var rows = csv.split('\n');
    var gridRows = rows.slice(1, 1 + 48);
    ok('CSV 行数 = 表头 + 48 行网格 + 空行 + 图例',
       rows.length === 1 + 48 + 1 + 1 + APP.state.result.sub.length,
       rows.length + ' 行');
    ok('CSV 每行列数 = 1 + 64', gridRows.every(function (l) { return l.split(',').length === 65; }));
    ok('CSV 内容与网格一致',
       gridRows[0].split(',')[1] === codeAt(0, 0) && gridRows[47].split(',')[64] === codeAt(47, 63),
       gridRows[0].split(',').slice(0, 4).join(','));
    var lt = APP.listText();
    ok('配色清单文本含全部色号',
       APP.state.result.sub.every(function (c) { return lt.indexOf(c.code + '\t') >= 0; }),
       lt.split('\n').length + ' 行');

    /* ---------- 20. 真实 UI 交互 ---------- */
    var D = frame.contentDocument;
    var st = function () { return D.getElementById('status').textContent; };

    D.getElementById('btnSample').click();
    var sampleOK = await waitFor(function () {
      return APP.state.img && /示例/.test(APP.state.imgName) && APP.state.srcW === 360 && /生成完成/.test(st());
    }, 200);
    ok('点「示例图片」按钮 → 载入内置图并自动出图', sampleOK,
       APP.state.imgName + ' ' + APP.state.srcW + '×' + APP.state.srcH + ' · ' + st());

    D.getElementById('btnPalette').click();
    await sleep(120);
    var chips = D.querySelectorAll('#palList .pchip');
    ok('色卡弹窗打开且色块数 = 色卡色数',
       !D.getElementById('paletteModal').classList.contains('hidden')
       && chips.length === W.PD.palettes.get(APP.opts.paletteId).colors.length,
       chips.length + ' 个色块');
    ok('系列筛选按钮已生成', D.querySelectorAll('#palSeries button').length >= 5,
       D.querySelectorAll('#palSeries button').length + ' 个系列');
    APP.opts.colors = 24; D.getElementById('colors').value = 24;
    D.getElementById('btnPalNone').click();
    var noneOK = await waitFor(function () { return /一个颜色都没勾选/.test(st()); }, 200);
    ok('「全不选」后提示无可用颜色', noneOK,
       '启用色数 ' + W.PD.palettes.get(APP.opts.paletteId).colors
          .filter(function (c) { return !(APP.state.disabled[APP.opts.paletteId] || {})[c.code]; }).length
       + ' · 状态栏「' + st() + '」');

    D.getElementById('btnPalAll').click();
    var allOK = await waitFor(function () { return /生成完成/.test(st()); }, 200);
    ok('「全选」后恢复出图', allOK && !!APP.summary() && APP.summary().colors > 1,
       (APP.summary() ? APP.summary().colors + ' 色 · ' : '') + st());
    ok('全不选→全选 不会弄丢「量化色数」设置', APP.opts.colors === 24, '仍为 ' + APP.opts.colors);
    D.getElementById('btnCloseModal').click();

    ok('配色清单默认按色号排序（A1→A2→B1…）',
       D.getElementById('listSort').value === 'code',
       '当前排序 = ' + D.getElementById('listSort').value);
    (function () {
      var codes = [].map.call(D.querySelectorAll('#colorList .crow .code'),
                              function (e) { return e.textContent.trim(); });
      var sorted = codes.slice().sort(function (a, b) {
        var ra = /^([A-Za-z]*)(\d*)/.exec(a), rb = /^([A-Za-z]*)(\d*)/.exec(b);
        if (ra[1] !== rb[1]) return ra[1] < rb[1] ? -1 : 1;
        return parseInt(ra[2] || '0', 10) - parseInt(rb[2] || '0', 10);
      });
      ok('清单顺序确实是字母升序 + 同字母内数字从小到大',
         codes.join(',') === sorted.join(','), codes.slice(0, 8).join(' '));
    })();

    var listRows = D.querySelectorAll('#colorList .crow');
    ok('右侧配色清单行数 = 结果色数', listRows.length === APP.state.result.sub.length,
       listRows.length + ' 行');
    listRows[0].click();
    ok('点击清单行可高亮', APP.state.highlight >= 0, 'highlight=' + APP.state.highlight);
    listRows[0].click();
    ok('再次点击取消高亮', APP.state.highlight === -1);

    var before = APP.state.result.sub.length;
    var seq0 = APP.state.computeSeq;
    // 清单是按用量排序的，所以要从 DOM 里取第一行对应的色号，而不是 sub[0]
    var victim2 = D.querySelector('#colorList .crow .code').textContent.trim();
    D.querySelector('#colorList .crow .kill').click();
    var killOK = await waitFor(function () { return APP.state.computeSeq > seq0; }, 200);
    ok('清单里的 🚫 能禁用颜色并重算',
       killOK && !APP.state.result.sub.some(function (c) { return c.code === victim2; }),
       '禁用 ' + victim2 + ' · ' + before + ' 色 → ' + APP.summary().colors + ' 色 · 重算了 '
       + (APP.state.computeSeq - seq0) + ' 次 · disabled='
       + JSON.stringify(Object.keys(APP.state.disabled[APP.opts.paletteId] || {})));
    APP.state.disabled[APP.opts.paletteId] = {};

    /* ---------- 21. 非法 URL 参数不能把页面搞崩 ---------- */
    var bad = document.createElement('iframe');
    bad.style.cssText = 'width:900px;height:520px;border:1px solid #2a323d;border-radius:8px;display:block;margin-top:10px';
    var badURL = new URL('../index.html', location.href);
    badURL.search = '?demo=1&view=BOGUS&algo=nope&dither=xxx&fitMode=??&sampleMode=%20'
      + '&w=99999&h=-3&colors=abc&cell=-5&mosaic=999&palette=zzz&label=nah&alpha=9e9';
    bad.src = badURL.href;
    document.body.appendChild(bad);
    await new Promise(function (r) { bad.addEventListener('load', r); });
    var BW = bad.contentWindow;
    var badOK = await waitFor(function () { return BW.PD && BW.PD.app && BW.PD.app.summary(); }, 200);
    var bo = BW.PD.app.opts, bv = BW.PD.app.view;
    ok('非法 URL 参数下仍能正常出图', badOK,
       badOK ? (BW.PD.app.summary().w + '×' + BW.PD.app.summary().h)
             : ('没出图 · img=' + !!BW.PD.app.state.img
                + ' seq=' + BW.PD.app.state.computeSeq
                + ' 状态「' + bad.contentDocument.getElementById('status').textContent + '」'));
    ok('非法枚举值回落到默认',
       bo.algo === 'kmeans' && bo.dither === 'none' && bo.fitMode === 'cover'
       && bo.sampleMode === 'ssim' && bv.mode === 'chart' && bv.labelMode === 'code'
       && bo.paletteId === 'mard221',
       [bo.algo, bo.dither, bo.fitMode, bo.sampleMode, bv.mode, bv.labelMode, bo.paletteId].join(' / '));
    ok('越界数值被夹到合法范围',
       bo.gridW === 200 && bo.gridH >= 5 && bo.colors >= 2 && bo.colors <= 64

    /* ---------- 22b-2. 细节保留：算法与采样 ---------- */
    await loadImg('fixtures/detail_test.png', 'detail_test.png');
    APP.opts.lockAspect = false; APP.opts.gridW = 60; APP.opts.gridH = 40;
    APP.opts.rotate = 0; APP.opts.flipH = false; APP.opts.flipV = false; APP.opts.crop = null;

    // 细节区在右侧约 68% 之后；统计该区域用到多少种不同色号
    // 量化质量的回归防线：K-Means 的结果应当贴近「色卡理论下限」。
    // 下限 = 不限色号预算时，每种真实颜色在 221 色卡里能找到的最佳匹配。
    // 这条测试保证以后有人改量化算法时不会悄悄退化。
    var BAR_RGB = [[230,25,35],[255,205,0],[0,165,80],[0,90,220],[235,0,140],[255,255,255],[15,15,15]];
    function theoreticalFloor() {
      var pal = W.PD.palettes.get(APP.opts.paletteId).colors, tot = 0, mx = 0;
      BAR_RGB.forEach(function (rgb) {
        var l = W.PD.color.rgbToLab(rgb[0], rgb[1], rgb[2], [0,0,0]);
        var bd = 1e9;
        for (var j = 0; j < pal.length; j++) {
          var d = W.PD.color.deltaE2000(l[0],l[1],l[2], pal[j].lab[0],pal[j].lab[1],pal[j].lab[2]);
          if (d < bd) bd = d;
        }
        tot += bd; if (bd > mx) mx = bd;
      });
      return [+(tot / BAR_RGB.length).toFixed(2), +mx.toFixed(2)];
    }
    function barFidelity() {
      var r2 = APP.state.result, tot = 0, cnt2 = 0, mx = 0;
      for (var bi = 0; bi < BAR_RGB.length; bi++) {
        var gx = Math.min(r2.w - 1, Math.round((360 + bi * 34 + 17) / 600 * r2.w));
        var gy = Math.round(r2.h * 0.25);
        var i2 = r2.idx[gy * r2.w + gx];
        if (i2 < 0) continue;
        var got = r2.sub[i2].rgb, want = BAR_RGB[bi];
        var l1 = W.PD.color.rgbToLab(got[0], got[1], got[2], [0,0,0]);
        var l2 = W.PD.color.rgbToLab(want[0], want[1], want[2], [0,0,0]);
        var de = W.PD.color.deltaE2000(l1[0], l1[1], l1[2], l2[0], l2[1], l2[2]);
        tot += de; if (de > mx) mx = de;
        cnt2++;
      }
      return [cnt2 ? +(tot / cnt2).toFixed(2) : 999, +mx.toFixed(2)];
    }
    run({ colors: 12, algo: 'kmeans', dither: 'none', sampleMode: 'area',
          mosaic: 1, blur: 0, sharpen: 0, fitMode: 'cover',
          brightness: 0, contrast: 0, saturation: 0, gamma: 100, bgRemove: false });
    var floorE = theoreticalFloor(), gotE = barFidelity();
    ok('K-Means 用 12 色就贴近色卡理论下限（平均 ΔE 差距 < 1.5）',
       gotE[0] - floorE[0] < 1.5,
       '平均 ΔE2000：实测 ' + gotE[0] + ' vs 理论下限 ' + floorE[0]
       + '（下限=不限色号预算时 221 色卡能达到的最好水平）');
    ok('最差色也没有离谱（与下限差距 < 4）', gotE[1] - floorE[1] < 4,
       '最差 ΔE2000：实测 ' + gotE[1] + ' vs 理论下限 ' + floorE[1]);

    // 七根纯色条本该只用 7 种色号；面积平均会在每条边界上生出中间色，
    // 数一数色条区实际用了多少种色号，就知道有多少「和稀泥」出来的颜色
    function colorsInBars() {
      var r2 = APP.state.result, seen = {};
      var y1 = Math.floor(r2.h * 0.48);
      for (var y = 1; y < y1; y++) {
        for (var x = Math.floor(r2.w * 0.62); x < r2.w; x++) {
          var i2 = r2.idx[y * r2.w + x];
          if (i2 >= 0) seen[r2.sub[i2].code] = 1;
        }
      }
      return Object.keys(seen).length;
    }
    run({ algo: 'kmeans', sampleMode: 'area', colors: 40 });
    var nArea = colorsInBars();
    run({ sampleMode: 'edge' });
    var nEdge = colorsInBars();
    ok('「边缘保留」采样减少边界上的中间色', nEdge < nArea,
       '七根纯色条区域用到的色号数：面积平均 ' + nArea + ' → 边缘保留 ' + nEdge + '（理想 7）');
    run({ colors: 12 });
    ok('边缘保留采样结果完整', APP.summary().total === 60 * 40, APP.summary().total + ' 颗');
    run({ sampleMode: 'area', algo: 'kmeans' });

    /* ---------- 22b-3. 纹理保留（DPID）端到端 ----------
       算法本身的性质在 tests/unit.js 里量化验证（细线贡献度 14%→50%，随 λ 单调）。
       这里只验端到端：整条管线接对了、纹理确实更明显、平滑区不被搞成噪点。 */
    await loadImg('fixtures/texture_test.png', 'texture_test.png');
    APP.opts.lockAspect = false; APP.opts.gridW = 80; APP.opts.gridH = 60;
    APP.opts.rotate = 0; APP.opts.flipH = false; APP.opts.flipV = false; APP.opts.crop = null;

    // 细线区（白底 + 深色细横线 + 红竖条）的平均亮度：
    // 面积平均会把细线稀释成接近白底，DPID 应当明显压暗
    function meanLuma(x0f, x1f, y0f, y1f) {
      var r2 = APP.state.result, sum = 0, n = 0;
      for (var y = Math.floor(r2.h * y0f); y < Math.floor(r2.h * y1f); y++) {
        for (var x = Math.floor(r2.w * x0f); x < Math.floor(r2.w * x1f); x++) {
          var i2 = r2.idx[y * r2.w + x];
          if (i2 < 0) continue;
          var c2 = r2.sub[i2].rgb;
          sum += 0.2126 * c2[0] + 0.7152 * c2[1] + 0.0722 * c2[2];
          n++;
        }
      }
      return n ? +(sum / n).toFixed(1) : -1;
    }
    var BASE = { colors: 32, algo: 'kmeans', dither: 'none', mosaic: 1, blur: 0, sharpen: 0,
                 fitMode: 'stretch', brightness: 0, contrast: 0, saturation: 0, gamma: 100,
                 bgRemove: false, texture: 100 };
    run(Object.assign({ sampleMode: 'area' }, BASE));
    var lumaA = meanLuma(0.52, 0.98, 0.05, 0.45);
    var smoothA = meanLuma(0.55, 0.95, 0.55, 0.95);
    run({ sampleMode: 'dpid' });
    var lumaD = meanLuma(0.52, 0.98, 0.05, 0.45);
    var smoothD = meanLuma(0.55, 0.95, 0.55, 0.95);

    ok('DPID 让细线区真正显形（不再被稀释成接近白底）', lumaD < lumaA - 25,
       '细线区平均亮度：面积平均 ' + lumaA + ' → DPID ' + lumaD + '（越低说明细线保留越多）');
    ok('DPID 不改变平滑渐变区的整体明暗', Math.abs(smoothD - smoothA) < 12,
       '平滑区（对照）：' + smoothA + ' → ' + smoothD);
    ok('DPID 结果完整', APP.summary().total === 80 * 60, APP.summary().total + ' 颗');

    run({ sampleMode: 'dpid', texture: 0 });
    ok('纹理强度 0 时退化为面积平均',
       Math.abs(meanLuma(0.52, 0.98, 0.05, 0.45) - lumaA) < 1.5,
       'λ=0 → ' + meanLuma(0.52, 0.98, 0.05, 0.45) + '，面积平均 ' + lumaA);
    run({ sampleMode: 'area', texture: 100 });

    // 感知优化降采样的算法性质（局部对比度不随格数塌陷）在 tests/unit.js 里
    // 用受控纹理严格验证：28.0 → 面积平均 15.2/10.3，感知优化 27.3/27.1。
    // 这里只验证它在整条管线里接对了：结果完整、与面积平均确实不同、无异常。
    await loadImg('fixtures/texture_test.png', 'texture_test.png');
    APP.opts.lockAspect = false; APP.opts.gridW = 40; APP.opts.gridH = 30;
    APP.opts.colors = 24; APP.opts.dither = 'none'; APP.opts.algo = 'kmeans';

    var errB = errs.length;
    run({ sampleMode: 'area' });
    var areaCodes = APP.summary().codes.join('|');
    run({ sampleMode: 'ssim' });

    /* ---------- 22b-4. 色数上限由色卡离散性决定 ----------

    await loadImg('fixtures/photo_landscape.png', 'photo_landscape.png');
    APP.state.img.dataset && 0;

    var blueRatio = cropped.codes.filter(function (c) { return /^C/.test(c); }).length / cropped.codes.length;

    APP.opts.crop = null; run({});

    /* ---------- 22d. 熨烫效果与双面预览 ---------- */
    APP.view.mode = 'preview';
    var errBefore = errs.length;
    [0, 1, 2, 3].forEach(function (lv) {

    APP.view.ironLevel = 1;
    APP.view.finish = 'paper';

       + ' → 毛巾 ' + (beadCell ? pixAt(p2, beadCell[0], beadCell[1]) : '?'));

    // 全熔必须看不出一颗颗豆子：相邻同色区内部的像素差异应该显著变小
    APP.view.finish = 'paper';
    function beadContrast(lv) {
      APP.view.ironLevel = lv;
      var cv = APP.renderPreviewCanvas(16);
      var g = cv.getContext('2d');
      // 在一片纯色区域里横向扫一行，统计相邻像素的最大跳变
      var rr2 = APP.state.result;
      var row = Math.floor(rr2.h * 0.85);          // 草地：大片同色
      var d = g.getImageData(0, row * 16 + 8, cv.width, 1).data;
      var mx = 0;
      for (var x = 16; x < cv.width - 16; x++) {
        var a = (x - 1) * 4, b = x * 4;
        var diff = Math.abs(d[a] - d[b]) + Math.abs(d[a + 1] - d[b + 1]) + Math.abs(d[a + 2] - d[b + 2]);
        if (diff > mx) mx = diff;
      }
      return mx;
    }
    var cRaw = beadContrast(0), cLight = beadContrast(1), cFull = beadContrast(3);
    ok('生豆能看出一颗颗圆柱（同色区内跳变明显）', cRaw > 40, '最大跳变 ' + cRaw);
    ok('全熔后颗粒边界基本消失（跳变远小于生豆）', cFull < cRaw * 0.5,

    ok('颗粒感随熨烫程度单调递减', cRaw >= cLight && cLight >= cFull,
       cRaw + ' ≥ ' + cLight + ' ≥ ' + cFull);
    APP.view.ironLevel = 1;

    // 纹理必须跟着网格一起滚动：同一个格子在不同滚动位置下应该长得一样
    APP.view.mode = 'preview'; APP.view.finish = 'glitter'; APP.view.cell = 24;
    APP.layout();
    var sc = D.getElementById('scroller');
    function cellPixels(gx, gy) {
      var mc = D.getElementById('mainCanvas');
      var dpr = Math.min(2, W.devicePixelRatio || 1);
      var px2 = Math.round((APP.state.offX - sc.scrollLeft + gx * APP.view.cell + APP.view.cell / 2) * dpr);
      var py2 = Math.round((APP.state.offY - sc.scrollTop + gy * APP.view.cell + APP.view.cell / 2) * dpr);
      if (px2 < 2 || py2 < 2 || px2 > mc.width - 2 || py2 > mc.height - 2) return null;
      var d = mc.getContext('2d').getImageData(px2 - 3, py2 - 3, 7, 7).data;
      return Array.prototype.join.call(d, ',');
    }
    sc.scrollLeft = 0; sc.scrollTop = 0; APP.render();
    var beforeScroll = cellPixels(12, 8);
    sc.scrollLeft = 37; sc.scrollTop = 23; APP.render();
    var afterScroll = cellPixels(12, 8);
    ok('闪粉等纹理跟着画布一起滚动（不会钉在屏幕上）',
       beforeScroll && afterScroll && beforeScroll === afterScroll,
       beforeScroll === afterScroll ? '滚动 37/23px 后同一格像素完全一致'
         : '同一格在滚动前后不一致 —— 纹理没跟着走');
    sc.scrollLeft = 0; sc.scrollTop = 0;
    APP.view.finish = 'paper'; APP.view.mode = 'chart'; APP.render();

    // 闪粉四种颜色
    APP.view.finish = 'glitter';
    var tintPix = {};
    ['silver', 'gold', 'pink', 'multi'].forEach(function (t) {
      APP.view.glitterTint = t;
      tintPix[t] = APP.renderPreviewCanvas(8).toDataURL().length;
    });
    ok('闪粉四种颜色渲染结果各不相同',
       new Set(Object.keys(tintPix).map(function (k) { return tintPix[k]; })).size >= 3,
       JSON.stringify(tintPix));
    APP.view.finish = 'paper'; APP.view.glitterTint = 'silver';

    APP.view.side = 'front'; APP.view.mode = 'chart'; APP.render();

    /* ---------- 22e. 撤销 / 重做 ---------- */
    var beforeColors = APP.opts.colors;
    D.getElementById('btnUndo').disabled = false;
    APP.opts.colors = 7; APP.compute();
    await sleep(800);                                   // 等防抖记录这一步
    var undoBtn = D.getElementById('btnUndo');
    var canUndo = !undoBtn.disabled;
    undoBtn.click();
    var undone = await waitFor(function () { return APP.opts.colors !== 7; }, 200);
    ok('撤销能回到上一步参数', canUndo && undone,
       '色数 ' + beforeColors + ' → 7 → 撤销后 ' + APP.opts.colors);
    var redoBtn = D.getElementById('btnRedo');
    redoBtn.click();
    var redone = await waitFor(function () { return APP.opts.colors === 7; }, 200);
    ok('重做能再回到 7 色', redone, '色数 ' + APP.opts.colors);

    // 禁用颜色也要能撤销
    APP.opts.colors = 16; APP.compute(); await sleep(800);
    var codeToKill = D.querySelector('#colorList .crow .code').textContent.trim();
    D.querySelector('#colorList .crow .kill').click();
    await waitFor(function () {
      return !APP.state.result.sub.some(function (c) { return c.code === codeToKill; });
    }, 200);
    D.getElementById('btnUndo').click();
    var back = await waitFor(function () {
      return !(APP.state.disabled[APP.opts.paletteId] || {})[codeToKill];
    }, 200);
    ok('禁用颜色后可以撤销回来', back,
       '禁用 ' + codeToKill + ' 后撤销 → 禁用表 '
       + JSON.stringify(Object.keys(APP.state.disabled[APP.opts.paletteId] || {})));

    /* ---------- 22f. 高亮可取消 ---------- */
    APP.state.highlight = 0; APP.renderColorList();
    ok('高亮时出现「显示全部颜色」按钮', !D.getElementById('btnClearHl').hidden);
    D.getElementById('btnClearHl').click();
    ok('点它能恢复显示全部', APP.state.highlight === -1 && D.getElementById('btnClearHl').hidden);

    /* ---------- 22g. 主题 ---------- */
    var themes = ['purple', 'blue', 'teal', 'rose', 'amber', 'light'];
    var themeOK = themes.every(function (t) {
      var b = D.querySelector('#themeDots button[data-t=' + t + ']');
      if (!b) return false;
      b.click();
      return D.documentElement.getAttribute('data-theme') === t && APP.view.theme === t;
    });
    ok('6 套主题都能切换并写入 data-theme', themeOK, themes.join(' / '));
    D.querySelector('#themeDots button[data-t=purple]').click();
    ok('默认主题是紫色', APP.view.theme === 'purple');

    /* ---------- 22h. 反馈 ---------- */
    D.getElementById('btnFeedback').click();
    await sleep(80);
    var diagTxt = D.getElementById('fbDiag').textContent;
    var diag = JSON.parse(diagTxt);
    ok('反馈弹窗打开且环境信息已采集',
       !D.getElementById('feedbackModal').classList.contains('hidden')
       && diag['浏览器'] && diag['屏幕'] && diag['窗口'] && diag['时区'] !== undefined,
       Object.keys(diag).join(' / '));
    ok('环境信息对用户可见（不是偷偷收集）',
       diagTxt.length > 100 && !D.getElementById('fbDiagWrap').hidden,
       '弹窗内展示 ' + diagTxt.length + ' 字符，并有勾选框可取消附带');
    D.getElementById('fbClose').click();

    /* ---------- 22i. 网格线加粗间距 ---------- */
    [0, 5, 10].forEach(function (n) {
      D.querySelector('#boldEvery button[data-n="' + n + '"]').click();
      ok('加粗间隔切到 ' + (n || '不加粗'), APP.view.boldEvery === n);
    });
    D.querySelector('#boldEvery button[data-n="10"]').click();

    // 关掉网格线，图纸上不该再剩任何线（含加粗线和外边框）
    APP.view.showGrid = true; APP.view.boldEvery = 10; APP.view.mode = 'chart';
    APP.view.labelMode = 'none';
    var withGrid = APP.renderChartCanvas({ cell: 12, legend: false });
    APP.view.showGrid = false;
    var noGrid = APP.renderChartCanvas({ cell: 12, legend: false });
    function countGrayLines(cv) {
      // 数一数有多少像素是网格线的灰色（#c9ccd2 / #6b7280）
      var g = cv.getContext('2d');
      var d = g.getImageData(0, 0, cv.width, cv.height).data, n = 0;
      for (var i = 0; i < d.length; i += 4) {
        if ((Math.abs(d[i] - 201) < 6 && Math.abs(d[i + 1] - 204) < 6 && Math.abs(d[i + 2] - 210) < 6) ||
            (Math.abs(d[i] - 107) < 6 && Math.abs(d[i + 1] - 114) < 6 && Math.abs(d[i + 2] - 128) < 6)) n++;
      }
      return n;
    }
    var gWith = countGrayLines(withGrid), gNo = countGrayLines(noGrid);
    ok('关掉网格线后，加粗线与外边框一并消失', gNo < gWith * 0.02,
       '网格线像素 ' + gWith + ' → ' + gNo);
    APP.view.showGrid = true; APP.view.labelMode = 'code';
    D.getElementById('showGrid').checked = true;

    /* ---------- 23. 响应式：任何宽度都不该出现横向溢出 ---------- */
    var WIDTHS = [360, 390, 430, 560, 860, 1024];
    for (var wi = 0; wi < WIDTHS.length; wi++) {
      var vw = WIDTHS[wi];
      var rf = document.createElement('iframe');
      rf.style.cssText = 'width:' + vw + 'px;height:760px;border:1px solid #2a323d;'
        + 'border-radius:8px;display:block;margin-top:10px';
      rf.src = new URL('../index.html?demo=1&w=29&h=29&colors=10', location.href).href;
      document.body.appendChild(rf);
      await new Promise(function (r) { rf.addEventListener('load', r); });
      var FW = rf.contentWindow, FD = rf.contentDocument;
      await waitFor(function () { return FW.PD && FW.PD.app && FW.PD.app.summary(); }, 200);
      // body 上有 overflow:auto 时它自己就是滚动容器，只看 documentElement 会漏掉溢出
      var de = FD.documentElement;
      var scrollW = Math.max(de.scrollWidth, FD.body.scrollWidth);
      var over = scrollW - vw;
      // 找右边缘越界的元素时要跳过 .scroller —— 图纸画布本来就靠它裁剪，
      // getBoundingClientRect 不受祖先裁剪影响，否则会误报。
      var offenders = [];
      [].forEach.call(FD.querySelectorAll('.panel *, .topbar *, .site-foot *'), function (el) {
        var r2 = el.getBoundingClientRect();
        if (r2.width > 0 && r2.right > vw + 0.5) {
          offenders.push((el.tagName + (el.id ? '#' + el.id : '.' + (el.className || '')))
            .slice(0, 28) + '→' + Math.round(r2.right));
        }
      });
      offenders.sort();
      var worst = offenders.length ? vw + 1 : 0;
      var culprit = offenders.length ? offenders.slice(0, 4).join(' , ') + (offenders.length > 4 ? ' …共' + offenders.length + '个' : '') : '无';
      ok('宽度 ' + vw + 'px 时无横向溢出', over <= 1 && worst <= vw + 1,
         'scrollWidth ' + scrollW + ' / 超出视口的元素：' + culprit);

      // 窄屏最容易出问题的是「标签+滑块+数值框」这类行，数值框不能被挤出面板
      var panelR = FD.querySelector('.panel.left').getBoundingClientRect().right;
      var clipped = ['gridWNum', 'colorsNum', 'mosaicVal', 'ditherAmtVal', 'cellSizeVal']
        .filter(function (id) {
          var r3 = FD.getElementById(id).getBoundingClientRect();
          return r3.width < 4 || r3.right > panelR + 1;
        });
      ok('宽度 ' + vw + 'px 时数值框/读数没有被挤出面板', clipped.length === 0,
         clipped.length ? '被挤出：' + clipped.join(', ') : '全部可见（面板右缘 ' + Math.round(panelR) + 'px）');
      rf.remove();
    }

    ok('全程无未捕获异常', errs.length === 0, errs.join(' | ') || '无');

    /* ---------- 画廊 ---------- */
    show('导出图纸（cell=14，含图例）', shrink(chart, 300));
    show('成品预览', shrink(pv, 300));
    await loadImg('fixtures/sprite_pixel.png', 'sprite');
    APP.opts.gridW = APP.opts.gridH = 32;
    run({ colors: 12, sampleMode: 'dominant', fitMode: 'contain' });
    show('像素精灵 · 图纸', shrink(APP.renderChartCanvas({ cell: 16, legend: true }), 300));
    show('像素精灵 · 预览', shrink(APP.renderPreviewCanvas(10), 300));

    finish();
  }

  /* 取某格色号 */
  function codeAt(y, x) {
    var r = APP.state.result;
    var i = r.idx[y * r.w + x];
    return i < 0 ? '（空）' : r.sub[i].code;
  }
  /* 检查马赛克块内是否同色 */
  function blockUniform(m) {
    var r = APP.state.result, bad = 0, checked = 0;
    for (var by = 0; by + m <= r.h; by += m) {
      for (var bx = 0; bx + m <= r.w; bx += m) {
        var v = r.idx[by * r.w + bx];
        for (var y = by; y < by + m; y++) for (var x = bx; x < bx + m; x++) {
          checked++;
          if (r.idx[y * r.w + x] !== v) bad++;
        }
      }
    }
    return checked > 0 && bad === 0;
  }
  function shrink(cv, maxW) {
    if (cv.width <= maxW) return cv;
    var s = maxW / cv.width;
    var o = document.createElement('canvas');
    o.width = maxW; o.height = Math.round(cv.height * s);
    var c = o.getContext('2d');
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(cv, 0, 0, o.width, o.height);
    return o;
  }

  function finish() {
    var el = document.getElementById('sum');
    el.className = fail === 0 ? 'pass' : 'fail';
    el.textContent = fail === 0
      ? ('全部通过 ✅  ' + pass + '/' + pass + ' 项')
      : ('有失败 ❌  通过 ' + pass + '，失败 ' + fail);
    document.title = (fail === 0 ? 'PASS' : 'FAIL') + ' ' + pass + '/' + (pass + fail);
    document.body.setAttribute('data-result', fail === 0 ? 'PASS' : 'FAIL');
    document.body.setAttribute('data-pass', String(pass));
    document.body.setAttribute('data-fail', String(fail));
  }
})();
</script>
